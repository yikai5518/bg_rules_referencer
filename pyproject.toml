dependencies = [
    "boardgamegeek>=0.13.2",
    "ddgs>=9.11.4",
    "duckduckgo-search>=8.1.1",
    "googlesearch-python>=1.3.0",
    "langchain-core>=1.2.19",
    "langchain-google-genai>=4.2.1",
    "langgraph>=1.1.2",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "docling>=2.140.0",
    "llama-index-core>=0.14.25",
    "llama-index-readers-docling>=0.5.0",
    "llama-index-embeddings-gemini>=0.4.2",
    "llama-index-retrievers-bm25>=0.8.0",
    "pymupdf>=1.27.2",
    "requests>=2.32.5",
    "streamlit>=1.55.0",
